<div class="p-6 sm:p-8 bg-white dark:bg-slate-900 text-slate-900 dark:text-slate-100 rounded-3xl">
  <!-- Dialog Header -->
  <div class="flex items-start justify-between gap-4 mb-6">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-700 to-indigo-500 text-white flex items-center justify-center font-bold text-sm shadow-md shadow-blue-500/20 shrink-0">
        $
      </div>
      <div>
        <h2 class="text-xl font-bold tracking-tight text-slate-900 dark:text-slate-100">
          Prosperity Pulse
        </h2>
        <p class="text-xs text-slate-500 dark:text-slate-400">
          Sign in to sync your preferences and bookmarks.
        </p>
      </div>
    </div>

    <button
      type="button"
      (click)="close()"
      class="w-8 h-8 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center transition-colors -mr-1"
      aria-label="Close dialog"
    >
      <mat-icon class="!w-4 !h-4 !text-base leading-none">close</mat-icon>
    </button>
  </div>

  <!-- Error Message Banner -->
  @if (errorMessage) {
    <div class="mb-4 p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-300 text-xs flex items-center gap-2">
      <mat-icon class="!w-4 !h-4 !text-base text-rose-500 shrink-0">error_outline</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>
  }

  <mat-dialog-content class="!p-0 space-y-4">
    <!-- Email / Password Form -->
    <form (ngSubmit)="submitLogin()" class="flex flex-col gap-3.5">
      <mat-form-field appearance="outline" class="w-full !mb-0">
        <mat-label>Email Address</mat-label>
        <mat-icon matPrefix class="!mr-2 text-slate-400">email</mat-icon>
        <input
          matInput
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="investor@example.com"
          required
          [disabled]="isLoading"
        />
      </mat-form-field>

      <mat-form-field appearance="outline" class="w-full !mb-0">
        <mat-label>Password</mat-label>
        <mat-icon matPrefix class="!mr-2 text-slate-400">lock</mat-icon>
        <input
          matInput
          [type]="hidePassword ? 'password' : 'text'"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          [disabled]="isLoading"
        />
        <button
          mat-icon-button
          matSuffix
          type="button"
          (click)="hidePassword = !hidePassword"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          class="!w-7 !h-7 mr-1"
        >
          <mat-icon class="!text-base">{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
      </mat-form-field>

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="w-full !rounded-full !h-11 !text-sm !font-semibold shadow-md mt-1"
        [disabled]="isLoading || !email || !password"
      >
        <span class="inline-flex items-center gap-2">
          @if (isLoading) {
            <mat-spinner diameter="18"></mat-spinner>
            <span>Signing in...</span>
          } @else {
            <span>Sign In</span>
            <mat-icon class="!w-4 !h-4 !text-base">arrow_forward</mat-icon>
          }
        </span>
      </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center gap-3 my-4">
      <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
      <span class="text-slate-400 dark:text-slate-500 text-xs font-medium uppercase">or</span>
      <div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
    </div>

    <!-- Google Sign In Button -->
    <button
      mat-stroked-button
      type="button"
      (click)="loginWithGoogle()"
      [disabled]="isLoading"
      class="w-full !rounded-full !h-11 !text-xs !font-medium"
    >
      <span class="inline-flex items-center justify-center gap-2.5">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path
            fill="#4285F4"
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
          />
          <path
            fill="#34A853"
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
          />
          <path
            fill="#FBBC05"
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"
          />
          <path
            fill="#EA4335"
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"
          />
        </svg>
        <span>Continue with Google</span>
      </span>
    </button>
  </mat-dialog-content>
</div>
