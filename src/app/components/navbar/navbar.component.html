<header
  class="sticky top-0 z-50 w-full border-b border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-950/80 backdrop-blur-md transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-18 flex items-center justify-between gap-4">
    <!-- Brand Logo & Name -->
    <div class="flex items-center gap-6 sm:gap-8">
      <a routerLink="/" class="flex items-center gap-3 group">
        <div
          class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-700 via-blue-600 to-indigo-500 p-0.5 shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
          <div class="w-full h-full rounded-[14px] flex items-center justify-center bg-blue-600">
            <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 17L9 11L13 15L21 7" stroke="white" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round" />
              <circle cx="21" cy="7" r="2" fill="#4ade80" />
            </svg>
          </div>
        </div>
        <div class="flex flex-col leading-none">
          <span
            class="text-lg font-bold tracking-tight text-slate-900 dark:text-slate-50 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">
            Prosperity Pulse
          </span>
          <span class="text-[11px] text-slate-500 dark:text-slate-400 font-medium hidden sm:block">
            Financial News Intelligence
          </span>
        </div>
      </a>

      <!-- Navigation Links -->
      <nav class="hidden md:flex items-center gap-1.5" aria-label="Main Navigation">
        <a routerLink="/" routerLinkActive="active-nav-link" [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link px-3.5 py-1.5 rounded-full text-sm font-medium text-slate-900 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-all">
          Home
        </a>
        <a routerLink="/news-feed" routerLinkActive="active-nav-link"
          class="nav-link px-3.5 py-1.5 rounded-full text-sm font-medium text-slate-900 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-all flex items-center gap-1.5">
          <span>News Feed</span>
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
        </a>
        @if (user$ | async) {
        <a routerLink="/profile" routerLinkActive="active-nav-link"
          class="nav-link px-3.5 py-1.5 rounded-full text-sm font-medium text-slate-900 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-all">
          Preferences
        </a>
        }
      </nav>
    </div>

    <!-- Right Controls -->
    <div class="flex items-center gap-2.5 sm:gap-3">
      <!-- Dark Mode Toggle Button -->
      <button type="button" (click)="toggleDarkMode()"
        matTooltip="{{ darkMode ? 'Switch to Light mode' : 'Switch to Dark mode' }}"
        class="flex items-center justify-center w-9 h-9 rounded-full border border-slate-200 dark:border-slate-900 text-slate-100 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-white transition-all shadow-xs"
        aria-label="Toggle dark mode">
        <mat-icon class="!w-4 !h-4 !text-lg leading-none">
          {{ darkMode ? 'light_mode' : 'dark_mode' }}
        </mat-icon>
      </button>

      <!-- Auth State Section -->
      @if (user$ | async; as currentUser) {
      <!-- User Profile Dropdown Menu Trigger -->
      <div class="relative">
        <button type="button" (click)="toggleProfileMenu()"
          class="flex items-center gap-2 p-1 pl-1 pr-2.5 rounded-full border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all"
          aria-label="User profile menu" [attr.aria-expanded]="showProfileMenu">
          <div
            class="w-7 h-7 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center font-bold text-xs shadow-xs overflow-hidden">
            @if (currentUser.photoURL) {
            <img [src]="currentUser.photoURL" [alt]="currentUser.displayName || 'User'"
              class="w-full h-full object-cover" />
            } @else {
            <span>{{ getInitials(currentUser.displayName, currentUser.email) }}</span>
            }
          </div>
          <span
            class="text-xs font-semibold text-slate-700 dark:text-slate-200 max-w-[100px] truncate hidden sm:inline-block">
            {{ currentUser.displayName || 'Account' }}
          </span>
          <mat-icon class="!w-3.5 !h-3.5 !text-sm text-slate-400">expand_more</mat-icon>
        </button>

        <!-- Dropdown Menu -->
        @if (showProfileMenu) {
        <!-- Backdrop click listener -->
        <div class="fixed inset-0 z-20" (click)="closeProfileMenu()"></div>

        <div
          class="absolute right-0 mt-2 w-64 rounded-2xl shadow-xl py-2 bg-white dark:bg-slate-900 border border-slate-200/90 dark:border-slate-800 z-30 transition-all animate-in fade-in zoom-in-95 duration-150">
          <!-- User preview banner -->
          <div class="px-4 py-2.5 border-b border-slate-100 dark:border-slate-800">
            <div class="font-semibold text-sm text-slate-900 dark:text-slate-100 truncate">
              {{ currentUser.displayName || 'Prosperity Reader' }}
            </div>
            <div class="text-xs text-slate-500 dark:text-slate-400 truncate">
              {{ currentUser.email }}
            </div>
          </div>

          <!-- Menu items -->
          <div class="py-1">
            <a routerLink="/profile" (click)="closeProfileMenu()"
              class="flex items-center gap-2.5 px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <mat-icon class="!w-4 !h-4 !text-base text-blue-600 dark:text-blue-400">tune</mat-icon>
              <span>Profile Preferences</span>
            </a>

            <a routerLink="/news-feed" (click)="closeProfileMenu()"
              class="flex items-center gap-2.5 px-4 py-2 text-xs font-medium text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
              <mat-icon class="!w-4 !h-4 !text-base text-indigo-600 dark:text-indigo-400">feed</mat-icon>
              <span>Latest News Feed</span>
            </a>
          </div>

          <div class="border-t border-slate-100 dark:border-slate-800 pt-1">
            <button type="button" (click)="logout()"
              class="w-full flex items-center gap-2.5 px-4 py-2 text-xs font-medium text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors text-left">
              <mat-icon class="!w-4 !h-4 !text-base text-rose-500">logout</mat-icon>
              <span>Sign Out</span>
            </button>
          </div>
        </div>
        }
      </div>
      } @else {
      <!-- Login Button -->
      <button mat-flat-button color="primary" type="button" (click)="openLoginDialog()"
        class="!rounded-full !px-4 !text-xs !h-9 shadow-sm">
        <span class="inline-flex items-center gap-1.5">
          <mat-icon class="!w-4 !h-4 !text-base">account_circle</mat-icon>
          <span>Sign In</span>
        </span>
      </button>
      }
    </div>
  </div>
</header>
