<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prosperity Pulse | Real-Time Financial News & Market Intelligence</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Prosperity Pulse | Real-Time Financial News &amp; Market Intelligence">
  <meta name="description" content="Stay ahead of market-moving stories with Prosperity Pulse. Real-time stock market updates, cryptocurrency trends, banking analysis, and macroeconomic insights from trusted financial publishers.">
  <meta name="keywords" content="finance news, stock market updates, cryptocurrency news, investing insights, macroeconomic trends, banking news, Wall Street analysis, real-time finance">
  <meta name="author" content="Prosperity Pulse">
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://prosperity-pulse.web.app/">
  <meta property="og:title" content="Prosperity Pulse | Real-Time Financial News &amp; Market Intelligence">
  <meta property="og:description" content="Curated financial stories, policy movements, and market shifts from verified publishers. Ranked by community engagement.">
  <meta property="og:site_name" content="Prosperity Pulse">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://prosperity-pulse.web.app/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Prosperity Pulse — see what's happening in finance at a glance">

  <!-- Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://prosperity-pulse.web.app/">
  <meta name="twitter:title" content="Prosperity Pulse | Real-Time Financial News &amp; Market Intelligence">
  <meta name="twitter:description" content="Curated financial stories, policy movements, and market shifts from verified publishers. Ranked by community engagement.">
  <meta name="twitter:image" content="https://prosperity-pulse.web.app/og-image.png">
  <meta name="twitter:image:alt" content="Prosperity Pulse — see what's happening in finance at a glance">

  <link rel="canonical" href="https://prosperity-pulse.web.app/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Fonts & Icons Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <!-- Firestore is on the critical path for every above-the-fold widget. -->
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin="">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
  <!-- display=swap keeps icon glyphs from blocking first paint (CLS/LCP). -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&amp;display=swap" rel="stylesheet">

  <!-- JSON-LD Structured Data for Search Engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "NewsMediaOrganization",
        "@id": "https://prosperity-pulse.web.app/#organization",
        "name": "Prosperity Pulse",
        "url": "https://prosperity-pulse.web.app",
        "logo": {
          "@type": "ImageObject",
          "url": "https://prosperity-pulse.web.app/icons/icon-512x512.png",
          "width": 512,
          "height": 512
        },
        "image": "https://prosperity-pulse.web.app/og-image.png",
        "description": "Real-time financial news, macroeconomic analysis, and sector intelligence platform.",
        "sameAs": []
      },
      {
        "@type": "WebSite",
        "@id": "https://prosperity-pulse.web.app/#website",
        "url": "https://prosperity-pulse.web.app",
        "name": "Prosperity Pulse",
        "publisher": {
          "@id": "https://prosperity-pulse.web.app/#organization"
        },
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://prosperity-pulse.web.app/news-feed?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body class="mat-typography">
  <app-root></app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
